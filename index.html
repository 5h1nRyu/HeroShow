<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeroShow</title>
  <meta name="description" content="" />
  <link rel="icon" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main id="app">
    <div id="viewport" role="img" aria-label="">
      <div id="stage" aria-hidden="true">
        <section id="board" class="scene board">
          <div id="board-field" class="instrument-field"></div>
          <div id="photo-panel" class="photo-panel"><div class="photo-texture"></div></div>
          <div id="header" class="board-header">
            <div id="label-mask" class="label-mask"><div id="eyebrow"></div></div>
          </div>
          <div id="identity" class="identity"><div class="identity-mark"><img id="team-logo" alt="" draggable="false" /></div></div>
          <h1 id="team-name" class="team-name"></h1>
          <div id="score-panel" class="score-panel">
            <div class="score-caption-mask"><div id="score-caption"></div></div>
            <div class="score-mask"><div id="score-row"><span id="score-number"></span><span id="score-unit"></span></div></div>
          </div>
          <div id="portrait-reveal" class="portrait-reveal"><div id="portrait-motion" class="portrait-motion"><img id="portrait" alt="" draggable="false" /></div></div>
          <section id="metrics-panel" class="metrics-panel">
            <div id="metrics-note" class="metrics-note" hidden></div>
            <div id="metrics" class="metrics"></div>
          </section>
        </section>
        <section id="reveal" class="scene reveal">
          <div id="reveal-field" class="instrument-field"></div>
          <div id="reveal-name" class="reveal-name"></div>
        </section>
        <section id="bridge" class="scene bridge">
          <div class="bridge-slices"><div class="wipe-slice"></div><div class="wipe-slice"></div><div class="wipe-slice"></div><div class="wipe-slice"></div><div class="wipe-slice"></div></div>
        </section>
        <div class="grain"></div>
      </div>
    </div>
    <div id="controls" aria-label="动画播放控制" aria-hidden="true">
      <div class="transport">
        <button id="play" type="button" disabled>播放</button>
        <button id="replay" type="button" title="重新播放（R）" disabled>重播</button>
        <label class="sr-only" for="seek">动画进度</label>
        <input id="seek" type="range" min="0" max="1" step="0.1" value="0" disabled />
        <output id="time" for="seek"></output>
        <label class="sr-only" for="speed">播放速度</label>
        <select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
        <button id="full" type="button" title="全屏（F）">全屏</button>
      </div>
      <div class="chapters" aria-label="动画阶段">
        <button type="button" data-chapter="0"><span></span> <small></small></button>
        <button type="button" data-chapter="0"><span></span> <small></small></button>
        <button type="button" data-chapter="0"><span></span> <small></small></button>
      </div>
    </div>
    <div id="status" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
